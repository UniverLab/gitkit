[package]
name = "gitkit"
version = "0.6.0"
edition = "2021"
description = "Standalone CLI for configuring git repos — hooks, .gitignore, and .gitattributes"
license = "MIT"
repository = "https://github.com/UniverLab/gitkit"
homepage = "https://univerlab.org/gitkit"
keywords = ["git", "hooks", "cli", "gitignore", "gitattributes"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gitkit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml = "0.8"
regex = "1"
ureq = "2"
# SHA256 verification of release assets (same file install.sh checks).
sha2 = "0.10"
# Staging an in-place binary replacement needs a same-directory temp file,
# so tempfile is production code, not just a dev dependency.
tempfile = "3"

[dev-dependencies]
serial_test = "3.5.0"

[dependencies.inquire]
version = "0.9"
