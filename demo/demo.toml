[demo]
name = "demo"
output_dir = "./dist"
speed = "2x"
targets = ["gif", "mp4", "svg"]
prompt = '\[\e[1;32m\]gitkit@univerlab\[\e[0m\]:\[\e[1;34m\]~\[\e[0m\]$ '

# `demo record` starts the PTY in $HOME; clone into a scratch dir instead.
[env]
setup_script = "rm -rf /tmp/gitkit-demo && mkdir -p /tmp/gitkit-demo && cd /tmp/gitkit-demo"
teardown_script = "rm -rf /tmp/gitkit-demo"

[typing]
base_ms = 80
salt_ms = 15

[layout]
width = 1440
height = 1080
fps = 15
line_height = 1.2000000476837158
background = "#0b0f14"
font_family = "IBM Plex Mono"

[[layout.panes]]
id = "main"
type = "terminal"
x = 0
y = 0
width = 1440
height = 1080
font_family = "monospace"
font_size = 16

[[timeline]]
action = "focus"
pane = "main"

[[timeline]]
action = "type"
text = "gitkit clone https://github.com/Univerlab/gitkit.git"
human_salt = true

